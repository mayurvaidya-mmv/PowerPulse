<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerPulse — Stored Data</title>
  <link rel="stylesheet" href="/public/css/dashboard.css" />
  <link rel="stylesheet" href="/public/css/data-table.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <script src="/public/js/config.js"></script>
</head>

<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-overlay"></div>
      <div class="sidebar-header">
        <h2><i class="fas fa-bolt"></i> PowerPulse</h2>
        <button id="toggleSidebar" title="Toggle Sidebar">
          <i class="fas fa-bars"></i>
        </button>
      </div>

      <ul class="nav-list">
        <li><a href="/dashboard"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
        <li class="active"><a href="/stored-data"><i class="fas fa-table"></i><span>Data Table</span></a></li>
        <li><a href="/reports"><i class="fas fa-chart-bar"></i><span>Reports</span></a></li>
        <li><a href="#"><i class="fas fa-cog"></i><span>Settings</span></a></li>
        <li><a href="/register-config"><i class="fas fa-microchip"></i><span>Register Config</span></a></li>
        <li><a href="/dashboard#historySection"><i class="fas fa-chart-line"></i><span>History</span></a></li>

        <li class="admin-nav-item" style="display:none;"><a href="/dashboard#lambdaSection"><i class="fas fa-code"></i><span>Lambda</span></a></li>
        <li class="admin-nav-item" style="display:none;"><a href="/dashboard#snsSection"><i class="fas fa-bell"></i><span>SNS Alerts</span></a></li>
      </ul>

      <footer class="sidebar-footer">
        <small>v2.0 — © PowerPulse</small>
      </footer>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <h1>📋 Stored Data</h1>
          <p class="subtitle">Historical Meter Readings — Grid & Generator</p>
        </div>
        <div class="header-actions">
          <div id="userProfile"
            style="display: flex; align-items: center; gap: 8px; background: rgba(99,102,241,0.15); padding: 6px 14px; border-radius: 10px; border: 1px solid rgba(99,102,241,0.25);">
            <i class="fas fa-user-circle" style="font-size: 1.2rem; color: #818cf8;"></i>
            <span id="userName" style="font-weight: 600; font-size: 0.85rem;">...</span>
          </div>
          <button id="themeToggle">🌙 Dark Mode</button>
          <a href="/api/auth/logout" id="logoutBtn"
            style="padding: 8px 16px; background: #ef4444; color: white; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600;">🚪
            Logout</a>
        </div>
      </header>

      <!-- Filter Controls -->
      <section class="section">
        <div class="data-filter-controls">
          <div class="filter-group">
            <label for="dataSource" class="control-label">⚡ Source</label>
            <select id="dataSource" class="history-dropdown">
              <option value="grid">⚡ Grid</option>
              <option value="generator">🔧 Generator</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="dataRange" class="control-label">📅 Time Range</label>
            <select id="dataRange" class="history-dropdown">
              <option value="daily" selected>Last 24 Hours</option>
              <option value="weekly">Last 7 Days</option>
              <option value="monthly">Last 30 Days</option>
              <option value="custom">Custom Range</option>
            </select>
          </div>

          <div id="dataCustomDates" class="data-custom-dates" style="display:none;">
            <div class="filter-group">
              <label for="dataStartDate" class="control-label">From</label>
              <input type="date" id="dataStartDate">
            </div>
            <div class="filter-group">
              <label for="dataEndDate" class="control-label">To</label>
              <input type="date" id="dataEndDate">
            </div>
          </div>

          <div class="filter-group">
            <label for="dataFrequency" class="control-label">⏱️ Frequency</label>
            <select id="dataFrequency" class="history-dropdown">
              <option value="none" selected>None (Raw)</option>
              <option value="hour">Every Hour</option>
              <option value="6hour">Every 6 Hours</option>
              <option value="12hour">Every 12 Hours</option>
              <option value="day">Daily</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="dataLimit" class="control-label">📊 Limit</label>
            <select id="dataLimit" class="history-dropdown">
              <option value="100">100</option>
              <option value="200" selected>200</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
              <option value="all">All</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="dataSort" class="control-label">↕️ Sort Order</label>
            <select id="dataSort" class="history-dropdown">
              <option value="desc" selected>Newest First (Old to Early)</option>
              <option value="asc">Oldest First (Early to Old)</option>
            </select>
          </div>

          <div class="filter-group column-picker-group">
            <label class="control-label">⚙️ Columns</label>
            <div class="dropdown-wrapper">
              <button id="columnPickerBtn" class="history-dropdown" style="text-align: left; display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <span>Select Columns</span>
                <i class="fas fa-chevron-down"></i>
              </button>
              <div id="columnPickerMenu" class="column-picker-menu" style="display: none;">
                <!-- Populated dynamically by JS -->
              </div>
            </div>
          </div>

          <button id="loadDataBtn" class="action-btn load-custom-btn">
            <i class="fas fa-search"></i> Load Data
          </button>
        </div>

        <div id="dataStatus" class="data-status"></div>
      </section>

      <!-- Data Tables -->
      <section class="section">
        <div class="table-wrapper">
          <table id="dataTable">
            <thead id="dataTableHead">
              <!-- Dynamically populated -->
            </thead>
            <tbody id="dataTableBody">
              <tr>
                <td colspan="8" style="text-align:center; padding: 40px; color: #64748b;">
                  Select a time range and click <strong>Load Data</strong>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="/public/js/storedData.js"></script>
</body>

</html>
